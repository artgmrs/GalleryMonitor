name: Gallery monitor

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: gallery-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore
        run: dotnet restore GalleryMonitor.sln
      - name: Build
        run: dotnet build GalleryMonitor.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test GalleryMonitor.sln --no-build --configuration Release
      - name: Publish
        run: dotnet publish src/GalleryMonitor/GalleryMonitor.csproj --no-build --configuration Release --output publish
      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: ./publish/GalleryMonitor
      - name: Persist gallery state
        run: |
          if [ ! -f data/gallery-state.json ] || [ -z "$(git status --porcelain -- data/gallery-state.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gallery-state.json
          git commit -m "chore: update gallery state"
          git pull --rebase
          git push
